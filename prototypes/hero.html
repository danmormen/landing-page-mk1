<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Prototipo · Hero · Estudio Brío</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bagel+Fat+One&family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,500;12..96,700;12..96,800&family=Figtree:wght@400;500;600;700&family=Gloock&family=Hanken+Grotesk:wght@400;500;600&family=Kalam:wght@400;700&display=swap" rel="stylesheet">
<style>
/* ============ Base ============ */
*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
img,svg{display:block}
button,input,select,textarea{font:inherit;color:inherit}
a{color:inherit}
:root{--ease-out:cubic-bezier(0.23,1,0.32,1)}
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
.wrap{width:min(1200px,100% - 48px);margin-inline:auto}
@media (max-width:640px){.wrap{width:calc(100% - 32px)}}

/* ============ Shared: botones ============ */
.btn{display:inline-flex;align-items:center;gap:10px;height:52px;padding:0 22px;border-radius:999px;border:0;font-weight:600;font-size:16px;text-decoration:none;cursor:pointer;transition:transform 160ms var(--ease-out),background-color 160ms ease-out,box-shadow 160ms ease-out}
.btn:active{transform:scale(0.97)}
.btn svg{width:20px;height:20px;flex:none}
.link{font-weight:500;text-underline-offset:4px;text-decoration-thickness:1.5px}

/* ============ Shared: secciones de abajo (usan las variables de cada variante) ============ */
.below{background:var(--s-bg);color:var(--s-ink);font-family:var(--s-body);padding:112px 0 140px}
.below h2{font-family:var(--s-display);font-weight:var(--s-display-w,700);font-size:clamp(2rem,4vw,3.25rem);line-height:1.02;letter-spacing:var(--s-track,-0.02em);margin:0 0 20px;text-wrap:balance}
.below .lead{color:var(--s-muted);font-size:18px;line-height:1.55;max-width:56ch;margin:0}
.services{display:grid;grid-template-columns:1fr 1fr;gap:64px;margin-top:56px;padding-top:40px;border-top:1px solid var(--s-line)}
.service h3{font-family:var(--s-display);font-weight:var(--s-display-w,700);font-size:clamp(1.5rem,2.4vw,2rem);letter-spacing:var(--s-track,-0.02em);margin:16px 0 12px;line-height:1.1}
.service p{color:var(--s-muted);line-height:1.6;margin:0 0 16px;max-width:46ch}
.service ul{margin:0;padding:0;list-style:none;display:grid;gap:10px}
.service li{display:flex;gap:10px;align-items:baseline;line-height:1.45}
.service li::before{content:"";flex:none;width:8px;height:8px;border-radius:50%;background:var(--s-accent);transform:translateY(-1px)}
.service .ico{width:44px;height:44px;color:var(--s-accent)}
.contact{display:grid;grid-template-columns:1fr 1.15fr;gap:72px;margin-top:128px;align-items:start}
.contact-ways{display:grid;gap:14px;margin-top:32px}
.contact-ways .btn{justify-content:flex-start;width:fit-content}
.btn-s{background:var(--s-accent);color:var(--s-accent-ink)}
.btn-s-ghost{background:transparent;color:var(--s-ink);box-shadow:inset 0 0 0 1.5px var(--s-line)}
@media (hover:hover) and (pointer:fine){.btn-s:hover{filter:brightness(1.06)}.btn-s-ghost:hover{box-shadow:inset 0 0 0 1.5px var(--s-ink)}}
.form{display:grid;grid-template-columns:1fr 1fr;gap:18px;background:var(--s-field-bg);border:1px solid var(--s-line);border-radius:var(--s-radius,20px);padding:32px}
.field{display:grid;gap:8px}
.field.full{grid-column:1/-1}
.field label{font-weight:600;font-size:14px}
.field input,.field select,.field textarea{width:100%;border:1.5px solid var(--s-line);background:var(--s-field);border-radius:12px;padding:13px 14px;font-size:16px;outline:none;transition:border-color 150ms ease-out,box-shadow 150ms ease-out}
.field textarea{min-height:110px;resize:vertical}
.field input:focus-visible,.field select:focus-visible,.field textarea:focus-visible{border-color:var(--s-accent);box-shadow:0 0 0 4px var(--s-focus)}
.field[data-error] input,.field[data-error] select,.field[data-error] textarea{border-color:#C8372D}
.field .err{display:none;color:#C8372D;font-size:13px;font-weight:500}
.field[data-error] .err{display:block}
.form .actions{grid-column:1/-1;display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.form .note{color:var(--s-muted);font-size:13px}
.form-done{grid-column:1/-1;display:none;padding:20px;border-radius:14px;background:var(--s-focus);font-weight:500;line-height:1.5}
.form[data-sent] .form-done{display:block}
.form[data-sent] .field,.form[data-sent] .actions{display:none}
@media (max-width:860px){
  .services,.contact{grid-template-columns:1fr;gap:48px}
  .contact{margin-top:96px}
  .below{padding:80px 0 120px}
}
@media (max-width:520px){.form{grid-template-columns:1fr;padding:22px}}

/* =========================================================
   VARIANTE 1 · CUADERNO  (antes / después que se arrastra)
   ========================================================= */
.v1{--paper:#F3F5FA;--ink:#141F45;--muted:#4B5677;--blue:#2B50D8;--pen:#2441B5;--lime:#D9F24F;--red:#E5484D;--line:#D5DBEA;
  background:var(--paper);color:var(--ink);font-family:"Bricolage Grotesque",system-ui,sans-serif;
  --s-bg:#fff;--s-ink:var(--ink);--s-muted:var(--muted);--s-accent:var(--blue);--s-accent-ink:#fff;--s-line:var(--line);--s-display:"Bricolage Grotesque",sans-serif;--s-body:"Bricolage Grotesque",sans-serif;--s-field:#fff;--s-field-bg:var(--paper);--s-focus:#DCE4FF;--s-track:-0.035em}
.v1 ::selection{background:var(--lime);color:var(--ink)}
.v1-nav{display:flex;align-items:center;justify-content:space-between;height:84px}
.v1-brand{display:flex;align-items:center;gap:10px;font-weight:800;font-size:20px;letter-spacing:-0.03em;text-decoration:none}
.v1-brand svg{width:30px;height:30px}
.v1-links{display:flex;align-items:center;gap:32px;font-weight:500}
.v1-links a{text-decoration:none}
.v1-links a:not(.btn){opacity:.8}
@media (hover:hover) and (pointer:fine){.v1-links a:not(.btn):hover{opacity:1}}
.v1-nav .btn{height:42px;padding:0 18px;font-size:15px;background:var(--ink);color:#fff}
.v1-hero{display:grid;grid-template-columns:1fr 1.08fr;gap:56px;align-items:center;padding:40px 0 64px;min-height:calc(100svh - 84px - 72px)}
.v1 h1{font-weight:800;font-size:clamp(2.75rem,5.6vw,5.25rem);line-height:.96;letter-spacing:-0.04em;margin:0 0 28px;text-wrap:balance}
.v1 h1 mark{white-space:nowrap;background:linear-gradient(transparent 58%,var(--lime) 58% 92%,transparent 92%);color:inherit;padding:0 .04em}
.v1-sub{font-size:19px;line-height:1.55;color:var(--muted);max-width:44ch;margin:0 0 36px}
.v1-ctas{display:flex;align-items:center;gap:22px;flex-wrap:wrap}
.v1-ctas .btn{background:var(--blue);color:#fff;box-shadow:0 10px 24px -10px rgba(43,80,216,.7)}
@media (hover:hover) and (pointer:fine){.v1-ctas .btn:hover{background:#2245c4}}
.v1-what{display:flex;gap:28px;margin-top:44px;padding-top:24px;border-top:1px solid var(--line);color:var(--muted);font-size:15px;flex-wrap:wrap}
.v1-what span{display:flex;align-items:center;gap:8px}
.v1-what svg{width:18px;height:18px;color:var(--blue)}

.v1-compare{position:relative;aspect-ratio:10/9;border-radius:20px;overflow:hidden;background:#fff;--pos:56%;
  box-shadow:0 40px 70px -30px rgba(20,31,69,.45),0 2px 8px rgba(20,31,69,.08),0 0 0 1px rgba(20,31,69,.06);touch-action:pan-y;user-select:none;-webkit-user-select:none}
.v1-layer{position:absolute;inset:0}
/* Después: sistema */
.v1-sys{padding:56px 26px 22px;display:flex;flex-direction:column;gap:16px;background:#fff}
.v1-sys-top{display:flex;justify-content:space-between;align-items:baseline;gap:12px}
.v1-sys-top b{font-size:19px;letter-spacing:-0.02em}
.v1-sys-top small{color:var(--muted);font-size:13px}
.v1-table{width:100%;border-collapse:collapse;font-size:14px}
.v1-table th{font-weight:500;color:var(--muted);text-align:left;font-size:12px;padding:0 8px 10px;border-bottom:1px solid var(--line)}
.v1-table td{padding:12px 8px;border-bottom:1px solid #EEF1F7;white-space:nowrap}
.v1-table td:first-child,.v1-table th:first-child{padding-left:0}
.v1-chip{display:inline-flex;align-items:center;gap:6px;height:24px;padding:0 10px;border-radius:999px;font-size:12px;font-weight:600}
.v1-chip::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.c-ok{background:#E3F6E8;color:#1E7A3C}.c-wait{background:#FFF1D6;color:#9A5B00}.c-move{background:#E4EAFF;color:#2B50D8}.c-due{background:#FDE5E4;color:#B3261E}
.v1-remind{margin-top:auto;display:flex;gap:12px;align-items:center;padding:14px 16px;border-radius:14px;background:var(--paper);font-size:14px}
.v1-remind svg{width:20px;height:20px;color:var(--blue);flex:none}
.v1-remind span{color:var(--muted)}
/* Antes: cuaderno */
.v1-note{clip-path:inset(0 calc(100% - var(--pos)) 0 0);
  background:
    linear-gradient(90deg,transparent 58px,rgba(229,72,77,.55) 58px 60px,transparent 60px),
    repeating-linear-gradient(#FDFDFB 0 35px,#B4C4EA 35px 36px);
  background-position:0 0,0 10px;
  font-family:Kalam,cursive;color:var(--pen);padding:54px 24px 0 78px;font-size:clamp(17px,1.6vw,21px);line-height:36px}
.v1-note p{margin:0;white-space:nowrap}
.v1-note .h{font-weight:700;font-size:1.15em;transform:rotate(-1.2deg);transform-origin:left;margin-bottom:0}
.v1-note s{text-decoration-thickness:2px;opacity:.8}
.v1-note .tilt{transform:rotate(-1.5deg);transform-origin:left}
.v1-note .red{color:#C8372D;font-weight:700}
.v1-note .circle{position:relative;display:inline-block}
.v1-note .circle svg{position:absolute;inset:-6px -10px;width:calc(100% + 20px);height:calc(100% + 12px);overflow:visible}
.v1-tag{position:absolute;top:14px;z-index:3;height:26px;padding:0 10px;border-radius:999px;font-size:12px;font-weight:700;display:flex;align-items:center;letter-spacing:.02em;pointer-events:none}
.v1-tag.l{left:14px;background:var(--ink);color:#fff}
.v1-tag.r{right:14px;background:var(--lime);color:var(--ink)}
.v1-demo{position:absolute;bottom:12px;right:14px;z-index:3;font-size:11px;color:var(--muted);background:rgba(255,255,255,.9);padding:3px 8px;border-radius:999px;pointer-events:none}
.v1-handle{position:absolute;top:0;bottom:0;left:var(--pos);width:2px;margin-left:-1px;background:var(--ink);z-index:2;pointer-events:none}
.v1-knob{position:absolute;top:50%;left:50%;width:48px;height:48px;margin:-24px 0 0 -24px;border-radius:50%;background:var(--ink);color:#fff;display:grid;place-items:center;box-shadow:0 6px 18px rgba(20,31,69,.35);transition:transform 160ms var(--ease-out)}
.v1-knob svg{width:24px;height:24px}
.v1-compare:active .v1-knob{transform:scale(.94)}
.v1-range{position:absolute;inset:0;width:100%;height:100%;opacity:0;margin:0;cursor:ew-resize;z-index:4;touch-action:pan-y}
.v1-range:focus-visible ~ .v1-handle .v1-knob{box-shadow:0 0 0 4px var(--lime),0 6px 18px rgba(20,31,69,.35)}
.v1-hint{margin-top:14px;text-align:center;font-size:14px;color:var(--muted)}
@media (max-width:980px){
  .v1-hero{grid-template-columns:1fr;gap:40px;min-height:0;padding-top:24px}
  .v1-links a:not(.btn){display:none}
}
@media (max-width:520px){
  .v1-sys{padding:52px 16px 16px}
  .v1-table .opt{display:none}
  .v1-note{padding-left:56px;background:linear-gradient(90deg,transparent 40px,rgba(229,72,77,.55) 40px 42px,transparent 42px),repeating-linear-gradient(#FDFDFB 0 31px,#B4C4EA 31px 32px);background-position:0 0,0 11px;line-height:32px;font-size:16px;padding-top:50px}
  .v1-compare{aspect-ratio:4/5}
}

/* =========================================================
   VARIANTE 2 · RÓTULO  (color pleno, letrero, conversación)
   ========================================================= */
.v2{--sun:#FFC633;--green:#0E3A2B;--green-2:#1C5A43;--tomato:#DB4128;--ink:#0E3A2B;--muted:#2F5A49;
  background:var(--sun);color:var(--green);font-family:Figtree,system-ui,sans-serif;
  --s-bg:#FFF4D1;--s-ink:var(--green);--s-muted:#3E6656;--s-accent:var(--green);--s-accent-ink:var(--sun);--s-line:#EAD9A0;--s-display:"Bagel Fat One",sans-serif;--s-display-w:400;--s-body:Figtree,sans-serif;--s-field:#FFFBEE;--s-field-bg:#FFEDB5;--s-focus:#FFD866;--s-track:-0.01em;--s-radius:28px}
.v2 ::selection{background:var(--green);color:var(--sun)}
.v2-nav{display:flex;align-items:center;justify-content:space-between;height:88px}
.v2-brand{font-family:"Bagel Fat One",sans-serif;font-size:26px;text-decoration:none;letter-spacing:-0.01em}
.v2-links{display:flex;gap:30px;align-items:center;font-weight:600}
.v2-links a{text-decoration:none}
.v2-links .btn{height:44px;padding:0 20px;font-size:15px;background:var(--green);color:var(--sun)}
.v2-hero{display:grid;grid-template-columns:1.25fr .9fr;gap:40px;align-items:center;padding:24px 0 72px;min-height:calc(100svh - 88px)}
.v2 h1{font-family:"Bagel Fat One",sans-serif;font-weight:400;font-size:clamp(3rem,7.4vw,6rem);line-height:.98;letter-spacing:-0.01em;margin:0 0 44px}
.v2 h1 span{display:block}
.v2 h1 .t{color:var(--tomato)}
.v2-sub{font-size:20px;line-height:1.5;max-width:40ch;margin:0 0 36px;color:var(--muted);font-weight:500}
.v2-ctas{display:flex;gap:22px;align-items:center;flex-wrap:wrap}
.v2-ctas .btn{background:var(--green);color:var(--sun);height:58px;padding:0 26px;font-size:17px;box-shadow:0 12px 24px -12px rgba(14,58,43,.6)}
@media (hover:hover) and (pointer:fine){.v2-ctas .btn:hover{background:var(--green-2)}}
.v2-side{position:relative;display:grid;justify-items:center;gap:0}
.v2-sign{position:relative;width:min(300px,80%);transform-origin:50% -60px;animation:v2-swing 1600ms var(--ease-out) both;padding-top:60px}
.v2-sign::before,.v2-sign::after{content:"";position:absolute;top:0;height:64px;width:2px;background:var(--green)}
.v2-sign::before{left:22%;transform:rotate(14deg);transform-origin:top}
.v2-sign::after{right:22%;transform:rotate(-14deg);transform-origin:top}
.v2-board{position:relative;background:var(--green);color:var(--sun);border-radius:18px;padding:18px 24px 16px;text-align:center;box-shadow:0 20px 30px -16px rgba(14,58,43,.55)}
.v2-board::before,.v2-board::after{content:"";position:absolute;top:10px;width:10px;height:10px;border-radius:50%;background:var(--sun);opacity:.85}
.v2-board::before{left:calc(22% - 2px)}.v2-board::after{right:calc(22% - 2px)}
.v2-board b{display:block;font-family:"Bagel Fat One",sans-serif;font-weight:400;font-size:52px;line-height:1;letter-spacing:.02em}
.v2-board small{display:block;margin-top:6px;font-weight:600;font-size:14px;opacity:.9}
@keyframes v2-swing{0%{transform:rotate(-9deg)}30%{transform:rotate(6deg)}55%{transform:rotate(-3deg)}75%{transform:rotate(1.4deg)}90%{transform:rotate(-.5deg)}100%{transform:rotate(0)}}
.v2-chat{width:min(380px,100%);margin-top:-6px;background:#fff;border-radius:26px;padding:16px;box-shadow:0 30px 60px -28px rgba(14,58,43,.55),0 2px 6px rgba(14,58,43,.1);transform:rotate(1.5deg);color:#14231d}
.v2-chat-top{display:flex;align-items:center;gap:10px;padding:2px 4px 12px;border-bottom:1px solid #F1EBDA}
.v2-ava{width:36px;height:36px;border-radius:50%;background:var(--tomato);color:#fff;display:grid;place-items:center;font-family:"Bagel Fat One";font-size:16px}
.v2-chat-top b{display:block;font-size:15px}
.v2-chat-top small{color:#5b6b64;font-size:12px}
.v2-chat-top .demo{margin-left:auto;font-size:11px;background:#F5EFDD;padding:3px 8px;border-radius:999px;color:#5b6b64}
.v2-msgs{display:grid;gap:8px;padding-top:14px}
.v2-msg{max-width:84%;padding:10px 14px;border-radius:18px;font-size:15px;line-height:1.4;opacity:0;transform:translateY(8px) scale(.98);animation:v2-in 380ms var(--ease-out) forwards}
.v2-msg.in{background:#F2F0E9;border-bottom-left-radius:6px;justify-self:start;transform-origin:bottom left}
.v2-msg.out{background:var(--green);color:#fff;border-bottom-right-radius:6px;justify-self:end;transform-origin:bottom right}
.v2-msg .lnk{display:block;margin-top:8px;padding:10px 12px;background:rgba(255,255,255,.12);border-radius:12px;font-size:13px}
.v2-msg .lnk b{display:block;color:var(--sun);font-size:14px}
.v2-sys{justify-self:center;font-size:12px;font-weight:600;color:#1E7A3C;background:#E3F6E8;padding:6px 12px;border-radius:999px;opacity:0;animation:v2-in 380ms var(--ease-out) forwards;display:flex;gap:6px;align-items:center}
.v2-sys svg{width:14px;height:14px}
@keyframes v2-in{to{opacity:1;transform:none}}
.v2-strip{border-top:2px solid var(--green);display:flex;justify-content:space-between;gap:24px;padding:22px 0 26px;font-weight:700;font-size:17px;flex-wrap:wrap}
.v2-strip span{display:flex;gap:10px;align-items:center}
.v2-strip svg{width:22px;height:22px}
@media (max-width:980px){.v2-hero{grid-template-columns:1fr;min-height:0;gap:56px}.v2-links a:not(.btn){display:none}}
@media (max-width:520px){.v2-board b{font-size:42px}.v2-strip{font-size:15px}}

/* =========================================================
   VARIANTE 3 · VITRINA  (sobrio, centrado, ejemplos en vivo)
   ========================================================= */
.v3{--bg:#F1F2EC;--ink:#17190F;--muted:#565B49;--olive:#4C5A26;--olive-d:#3C481D;--olive-l:#DCE2C6;--line:#D6D9C9;
  background:var(--bg);color:var(--ink);font-family:"Hanken Grotesk",system-ui,sans-serif;
  --s-bg:#fff;--s-ink:var(--ink);--s-muted:var(--muted);--s-accent:var(--olive);--s-accent-ink:#fff;--s-line:var(--line);--s-display:Gloock,serif;--s-display-w:400;--s-body:"Hanken Grotesk",sans-serif;--s-field:#fff;--s-field-bg:var(--bg);--s-focus:var(--olive-l);--s-track:-0.015em}
.v3 ::selection{background:var(--olive-l);color:var(--ink)}
.v3-nav{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;height:84px}
.v3-brand{font-family:Gloock,serif;font-size:24px;text-decoration:none}
.v3-links{display:flex;gap:34px;font-weight:500;color:var(--muted)}
.v3-links a{text-decoration:none}
@media (hover:hover) and (pointer:fine){.v3-links a:hover{color:var(--ink)}}
.v3-nav .btn{justify-self:end;height:42px;padding:0 18px;font-size:15px;background:var(--olive);color:#fff}
.v3-hero{text-align:center;padding:72px 0 0}
.v3 h1{font-family:Gloock,serif;font-weight:400;font-size:clamp(2.75rem,6.6vw,5.75rem);line-height:1.02;letter-spacing:-0.02em;margin:0 auto 26px;max-width:15ch;text-wrap:balance}
.v3-sub{font-size:19px;line-height:1.55;color:var(--muted);max-width:52ch;margin:0 auto 34px}
.v3-ctas{display:flex;justify-content:center;gap:14px;flex-wrap:wrap}
.v3-ctas .btn{background:var(--olive);color:#fff}
.v3-ctas .ghost{background:transparent;color:var(--ink);box-shadow:inset 0 0 0 1.5px var(--line)}
@media (hover:hover) and (pointer:fine){.v3-ctas .btn:not(.ghost):hover,.v3-nav .btn:hover{background:var(--olive-d)}.v3-ctas .ghost:hover{box-shadow:inset 0 0 0 1.5px var(--ink)}}
.v3-tabs{display:inline-flex;gap:4px;padding:4px;margin:64px auto 18px;background:#E5E7DD;border-radius:999px;max-width:100%;overflow-x:auto;scrollbar-width:none}
.v3-tabs::-webkit-scrollbar{display:none}
.v3-tab{border:0;background:transparent;height:36px;padding:0 16px;border-radius:999px;font-size:14px;font-weight:500;color:var(--muted);cursor:pointer;white-space:nowrap;transition:background-color 150ms ease-out,color 150ms ease-out}
.v3-tab[aria-selected="true"]{background:#fff;color:var(--ink);box-shadow:0 1px 3px rgba(23,25,15,.12)}
.v3-tab:focus-visible{outline:2px solid var(--olive);outline-offset:2px}

function initV1(root){
  const cmp = root.querySelector('.v1-compare');
  const range = root.querySelector('.v1-range');
  let raf, touched = false;
  const set = v => { cmp.style.setProperty('--pos', v + '%'); range.value = v; };
  range.addEventListener('input', () => { touched = true; cancelAnimationFrame(raf); set(range.value); });
  // Momento de entrada: el cuaderno se "abre" y revela el sistema (ease-out exponencial).
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  if (reduce){ set(52); return () => {}; }
  const from = 100, to = 52, dur = 1100, start = performance.now() + 350;
  const ease = t => 1 - Math.pow(2, -10 * t);
  const tick = now => {
    if (touched) return;
    const t = Math.min(1, Math.max(0, (now - start) / dur));
    set(from + (to - from) * ease(t));
    if (t < 1) raf = requestAnimationFrame(tick);
  };
  raf = requestAnimationFrame(tick);
  return () => cancelAnimationFrame(raf);
}

function initV3(root){
  const tabs = [...root.querySelectorAll('.v3-tab')];
  const sites = [...root.querySelectorAll('.v3-site')];
  const url = root.querySelector('.v3-url-t');
  let i = 0, timer;
  const show = n => {
    i = n;
    tabs.forEach((t,j)=>t.setAttribute('aria-selected', j===n));
    sites.forEach((s,j)=>s.toggleAttribute('data-on', j===n));
    url.textContent = SITES[n].url;
  };
  show(0);
  const stop = () => clearInterval(timer);
  tabs.forEach((t,j)=>t.addEventListener('click', ()=>{ stop(); show(j); }));
  if (!matchMedia('(prefers-reduced-motion: reduce)').matches){
    timer = setInterval(()=>show((i+1)%SITES.length), 4500);
  }
  root.querySelector('.v3-browser').addEventListener('pointerenter', stop);
  return stop;
}

/* ---------- Formulario (validación + estado enviado) ---------- */
function initForm(root){
  const form = root.querySelector('.form');
  if (!form) return;
  form.addEventListener('submit', e => {
    e.preventDefault();
    let first = null;
    form.querySelectorAll('[required]').forEach(el => {
      const bad = !el.value.trim();
      el.closest('.field').toggleAttribute('data-error', bad);
      el.setAttribute('aria-invalid', bad);
      if (bad && !first) first = el;
    });
    if (first){ first.focus(); return; }
    form.setAttribute('data-sent','');
  });
  form.addEventListener('input', e => {
    const f = e.target.closest('.field');
    if (f && e.target.value.trim()) { f.removeAttribute('data-error'); e.target.removeAttribute('aria-invalid'); }
  });
}

/* ---------- Harness (wiring de PICKER.md, con init por variante) ---------- */
const variants = [v1, v2, v3];
const inits = [initV1, () => () => {}, initV3];
let cleanup = () => {};

const stage = document.getElementById('stage');
const picker = document.querySelector('.proto-picker');
const highlight = picker.querySelector('.proto-picker-highlight');
const items = [...picker.querySelectorAll('.proto-picker-item:not(.proto-picker-replay)')];
const replay = picker.querySelector('.proto-picker-replay');
let current = 0;

function moveHighlight() {
  const el = items[current];
  highlight.style.width = el.offsetWidth + 'px';
  highlight.style.transform = `translateX(${el.offsetLeft}px)`;
}

function mount(i) {
  cleanup();
  stage.innerHTML = '';
  requestAnimationFrame(() => {
    stage.innerHTML = variants[i]();
    cleanup = inits[i](stage) || (() => {});
    initForm(stage);
  });
}

function setActive(i) {
  if (i < 0 || i >= variants.length) return;
  current = i;
  items.forEach((el, j) => {
    el.toggleAttribute('data-active', j === i);
    if (j === i) el.setAttribute('aria-current', 'true');
    else el.removeAttribute('aria-current');
  });
  moveHighlight();
  const url = new URL(location);
  url.searchParams.set('v', i + 1);
  history.replaceState(null, '', url);
  mount(i);
}

items.forEach((el, i) => el.addEventListener('click', () => setActive(i)));
replay?.addEventListener('click', () => mount(current));
window.addEventListener('resize', moveHighlight);

document.addEventListener('keydown', (e) => {
  if (/^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName) || e.target.isContentEditable) return;
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  const num = parseInt(e.key, 10);
  if (num >= 1 && num <= variants.length) setActive(num - 1);
  else if (e.key === 'ArrowRight') setActive((current + 1) % variants.length);
  else if (e.key === 'ArrowLeft') setActive((current - 1 + variants.length) % variants.length);
  else if (e.key === 'r' || e.key === 'R') mount(current);
});

const requested = parseInt(new URLSearchParams(location.search).get('v'), 10);
setActive(requested >= 1 && requested <= variants.length ? requested - 1 : 0);
requestAnimationFrame(() => requestAnimationFrame(() => picker.setAttribute('data-ready', '')));
</script>
