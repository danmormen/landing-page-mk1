# Revisión automática: en cada Pull Request (y en cada cambio a main)
# comprueba que el sitio no tiene errores y que compila.
name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Revisar y compilar
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Revisar errores (astro check)
        run: npm run check

      - name: Compilar el sitio (astro build)
        run: npm run build
